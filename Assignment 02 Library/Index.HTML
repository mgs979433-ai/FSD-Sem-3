<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>📚 Library Management System</h1>
            <p>Manage your books easily</p>
        </div>
    </header>

    <main class="container">

        <section class="form-section">

            <h2 id="formTitle">➕ Add New Book</h2>

            <form id="bookForm">

                <input type="hidden" id="bookId">

                <div class="input-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title"
                        placeholder="Enter book title" required>
                </div>

                <div class="input-group">
                    <label for="author">Author</label>
                    <input type="text" id="author"
                        placeholder="Enter author name" required>
                </div>

                <div class="input-group">
                    <label for="year">Publication Year</label>
                    <input type="number" id="year"
                        placeholder="Enter publication year" required>
                </div>

                <div class="button-group">

                    <button type="submit" class="btn primary">
                        💾 Save Book
                    </button>

                    <button type="button" id="cancelBtn"
                        class="btn cancel"
                        onclick="cancelEdit()"
                        style="display: none;">
                        Cancel
                    </button>

                </div>

            </form>

        </section>

        <section class="books-section">

            <div class="section-header">
                <h2>📖 All Books</h2>

                <button class="btn refresh" onclick="getBooks()">
                    🔄 Refresh
                </button>
            </div>

            <div id="booksContainer" class="books-container">
                <p class="loading">Loading books...</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Library Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
